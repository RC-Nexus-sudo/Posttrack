<!-- Fichier : views/entrants.html -->

<!-- Le conteneur principal qui remplace ce qui était généré dynamiquement -->
<div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden">
    <table class="w-full text-left border-collapse">
        <thead class="bg-slate-50 border-b border-slate-100">
            <tr class="text-[9px] uppercase tracking-[0.2em] text-slate-400 font-black">
                <th class="p-5">Indicateur</th>
                <th class="p-5">Date</th>
                <th class="p-5 text-center">Mode</th>
                <th class="p-5">Expéditeur & Type</th>
                <th class="p-5">Description</th>
                <th class="p-5">Destination</th>
                <th class="p-5">Encodé par</th>
                <th class="p-5">Modifié le</th>
                <th class="p-5 text-right">Actions</th>
            </tr>
        </thead>
        <!-- C'est ici que fetchData injectera les lignes dynamiques -->
        <tbody id="table-body-entrants" class="divide-y divide-slate-50">
            <tr>
                <td colspan="9" class="p-10 text-center text-slate-300 italic">Connexion à Firestore...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Optionnel : Un bouton pour ouvrir le formulaire d'ajout, si vous l'avez dans votre interface -->
<button onclick="App.modules.entrants.openForm()" class="fixed bottom-10 right-10 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition duration-300">
    + Ajouter Courrier
</button>
